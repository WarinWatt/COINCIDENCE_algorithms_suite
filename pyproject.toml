[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coincidence-algorithms-suite"
version = "0.1.0"
description = "Reusable COINcidence algorithms for permutation and multi-objective optimization"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Warin Wattanapornprom"}]
keywords = ["optimization", "permutation", "multi-objective", "EDA", "COIN"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.24", "numba>=0.57", "pymoo>=0.6.1,<0.7"]

[project.optional-dependencies]
rna = ["ViennaRNA>=2.7,<2.8"]
test = ["pytest>=7.4"]
notebook = ["matplotlib>=3.7", "jupyter>=1.0"]

[project.urls]
Repository = "https://github.com/WarinWatt/COINCIDENCE_algorithms_suite"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"coin.problems.tsptw" = ["benchmarks/**/*.txt"]
"coin.problems.rna_benchmarks" = ["*.bpseq"]
